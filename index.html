  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbw-hSsGQCHEYl6P2HG94hK2CqztDGRLLhnwedJuCQQ2djx9nUiU3LawPM-iqwmhOPKD/exec';
    const IMGBB_API_KEY = 'd6088edb9697a26a2e94f3ba26801487';

    let products = [];
    let html5QrcodeScanner = null;
    let targetInputIdForScan = null;
    let currentBrandLots = [];

    async function fetchData() {
      try {
        const res = await fetch(GAS_URL, { redirect: "follow" });
        if (!res.ok) throw new Error("HTTP Status " + res.status);
        products = await res.json();
        renderTable();
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการโหลดข้อมูล: ' + err.message);
      }
    }

    // ฟังก์ชันใส่วันที่ปัจจุบัน (YYYY-MM-DD) ให้ฟอร์มเพิ่มสินค้า
function setTodayDefault() {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  
  const todayStr = `${yyyy}-${mm}-${dd}`;
  
  // ใส่วันที่นำเข้าเป็นวันนี้อัตโนมัติ
  const importInput = document.querySelector('#addForm input[name="importDate"]');
  if (importInput && !importInput.value) {
    importInput.value = todayStr;
  }
}

// ฟังก์ชันแปลงวันที่สำหรับการแสดงผลการ์ดเป็น dd/mm/yyyy
function formatDMY(dateInput) {
  if (!dateInput || dateInput === '-') return '-';

  let year, month, day;

  if (typeof dateInput === 'string') {
    const cleanStr = dateInput.split('T')[0];
    if (cleanStr.includes('-')) {
      const parts = cleanStr.split('-');
      if (parts.length === 3) {
        if (parts[0].length === 4) { // YYYY-MM-DD
          year = parts[0]; month = parts[1]; day = parts[2];
        } else { // DD-MM-YYYY
          day = parts[0]; month = parts[1]; year = parts[2];
        }
      }
    }
  }

  if (year && month && day) {
    return `${String(day).padStart(2, '0')}/${String(month).padStart(2, '0')}/${year}`;
  }

  const d = new Date(dateInput);
  if (!isNaN(d.getTime())) {
    const dDay = String(d.getDate()).padStart(2, '0');
    const dMonth = String(d.getMonth() + 1).padStart(2, '0');
    const dYear = d.getFullYear();
    return `${dDay}/${dMonth}/${dYear}`;
  }

  return dateInput;
}

// ปรับปรุงฟังก์ชันเปิด Modal เพิ่มสินค้า
function toggleAddModal(show) {
  const modal = document.getElementById('addModal');
  modal.classList.toggle('hidden', !show);
  if (show) {
    setTodayDefault(); // เติมวันที่วันนี้ให้อัตโนมัติ
  }
}

    async function previewAndUploadImage(fileInput, previewContainerId, hiddenUrlInputId) {
      const file = fileInput.files[0];
      if (!file) return;

      if (IMGBB_API_KEY === 'YOUR_IMGBB_API_KEY') {
        alert('โปรดใส่ ImgBB API Key ในไฟล์ index.html ก่อนใช้งานฟังก์ชันอัปโหลดรูปภาพ');
        return;
      }

      const previewContainer = document.getElementById(previewContainerId);
      previewContainer.classList.remove('hidden');
      const previewImg = previewContainer.querySelector('img');
      previewImg.src = URL.createObjectURL(file);
      previewImg.style.opacity = '0.4';

      const formData = new FormData();
      formData.append('image', file);

      try {
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById(hiddenUrlInputId).value = data.data.url;
          previewImg.src = data.data.url;
          previewImg.style.opacity = '1';
        } else {
          alert('อัปโหลดรูปภาพไม่สำเร็จ: ' + data.error.message);
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการส่งรูปภาพ');
      }
    }

    // --- จัดกลุ่มสินค้าตามชื่อยี่ห้อ (Group by Brand) ---
    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const listEl = document.getElementById('productList');
      listEl.innerHTML = '';

      // กรองตามการค้นหา
      const filtered = products.filter(p => 
        (p.brand && p.brand.toLowerCase().includes(search)) || 
        (p.barcode && p.barcode.toLowerCase().includes(search)) ||
        (p.lotNo && p.lotNo.toLowerCase().includes(search))
      );

      // จัดกลุ่มสินค้าชื่อเดียวกัน
      const grouped = {};
      filtered.forEach(item => {
        const key = item.brand.trim();
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(item);
      });

      const brandNames = Object.keys(grouped);
      let grandTotalRem = 0;
      let alertCount = 0;

      if (brandNames.length === 0) {
        listEl.innerHTML = `<p class="text-center text-gray-400 py-8 col-span-full">ไม่พบรายการสินค้า</p>`;
      }

      brandNames.forEach(brand => {
        const lots = grouped[brand];
        const totalRem = lots.reduce((sum, item) => sum + Number(item.remainingQty || 0), 0);
        grandTotalRem += totalRem;

        // หา Lot ที่หมดอายุก่อนเพื่อน
        lots.sort((a, b) => (a.daysLeft === '-' ? 9999 : a.daysLeft) - (b.daysLeft === '-' ? 9999 : b.daysLeft));
        const earliestItem = lots[0];

        const isExpiringSoon = earliestItem.daysLeft !== '-' && earliestItem.daysLeft <= 30;
        const isLowStock = totalRem <= 2;
        if (isExpiringSoon || isLowStock) alertCount++;

        const card = document.createElement('div');
        card.className = 'bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between gap-3 relative overflow-hidden hover:shadow-md transition';
        
        const imageHTML = earliestItem.imageUrl 
          ? `<img src="${earliestItem.imageUrl}" alt="${brand}" class="w-16 h-16 object-cover rounded-lg bg-gray-100 flex-shrink-0" onerror="this.onerror=null; this.outerHTML='<div class=\\'w-16 h-16 bg-gray-100 rounded-lg flex items-center justify-center text-2xl flex-shrink-0\\'>🖼️</div>';">`
          : `<div class="w-16 h-16 bg-gray-100 rounded-lg flex items-center justify-center text-2xl flex-shrink-0">🖼️</div>`;

        const formattedExpDate = formatDMY(earliestItem.expDate);
        const unitName = earliestItem.unit || 'ถุง';

        card.innerHTML = `
          <div class="flex items-center gap-3 min-w-0 flex-1 cursor-pointer" onclick="openLotsModal('${brand}')">
            ${imageHTML}
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <h3 class="font-bold text-gray-900 text-sm truncate">${brand}</h3>
                <span class="text-[10px] bg-blue-50 text-blue-600 px-1.5 py-0.2 rounded font-semibold">📦 ${lots.length} Lots</span>
              </div>
              
              <div class="flex items-center gap-2 mt-0.5 text-xs">
                <span class="text-gray-500">ทุน: <b>${earliestItem.costPrice}฿</b></span>
                <span class="text-emerald-600 font-semibold bg-emerald-50 px-1.5 py-0.2 rounded">ขาย: <b>${earliestItem.suggestedPrice}฿</b></span>
              </div>

              <p class="text-xs text-gray-500 mt-0.5">คงเหลือรวม: <b class="text-base ${totalRem <= 2 ? 'text-rose-600' : 'text-blue-600'}">${totalRem}</b> ${unitName}</p>

              <div class="mt-1">
                <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold ${earliestItem.daysLeft <= 30 ? 'bg-rose-100 text-rose-600' : 'bg-gray-100 text-gray-600'}">
                  หมดอายุเร็วสุด: ${formattedExpDate}
                </span>
              </div>
            </div>
          </div>

          <div class="flex flex-col items-end gap-1 flex-shrink-0">
            <button onclick="handleDeduct('${earliestItem.rowIndex}')" class="bg-rose-500 hover:bg-rose-600 active:scale-95 text-white text-xs px-3 py-2 rounded-lg font-medium shadow flex items-center gap-1">
              ✂️ ตัด (-1)
            </button>
            <button onclick="openLotsModal('${brand}')" class="text-gray-400 hover:text-blue-600 text-[11px] p-1">
              🔍 ดู Lots
            </button>
          </div>
        `;
        listEl.appendChild(card);
      });

      document.getElementById('stat-total').innerText = brandNames.length;
      document.getElementById('stat-remaining').innerText = grandTotalRem;
      document.getElementById('stat-alert').innerText = alertCount;
    }

    // --- เปิด Modal แสดงรายการ Lots ของยี่ห้อนี้ ---
    function openLotsModal(brand) {
      currentBrandLots = products.filter(p => p.brand.trim() === brand.trim());
      
      document.getElementById('lotsTitle').innerText = brand;
      document.getElementById('lotsSubtitle').innerText = `มีทั้งหมด ${currentBrandLots.length} Lot(s)`;

      const container = document.getElementById('lotsContainer');
      container.innerHTML = '';

      currentBrandLots.forEach((item, index) => {
        const unitName = item.unit || 'ถุง';
        const formattedExpDate = formatDMY(item.expDate);
        const formattedImportDate = formatDMY(item.importDate);

        const lotCard = document.createElement('div');
        lotCard.className = 'bg-gray-50 p-3 rounded-xl border border-gray-200 flex justify-between items-center gap-2';
        
        lotCard.innerHTML = `
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2">
              <span class="font-bold text-sm text-gray-800">Lot: ${item.lotNo || 'Lot ' + (index + 1)}</span>
              ${item.barcode ? `<span class="text-[10px] font-mono bg-gray-200 text-gray-600 px-1 rounded">🏷️ ${item.barcode}</span>` : ''}
            </div>
            <div class="text-xs text-gray-500 mt-1 space-y-0.5">
              <p>เข้า: ${formattedImportDate} | หมดอายุ: <b>${formattedExpDate}</b></p>
              <p class="text-blue-600 font-medium">คงเหลือ Lot นี้: <b>${item.remainingQty}</b> ${unitName}</p>
            </div>
          </div>
          <div class="flex flex-col gap-1 items-end">
            <button onclick="handleDeduct('${item.rowIndex}')" class="bg-rose-500 hover:bg-rose-600 text-white text-xs px-2.5 py-1.5 rounded-lg font-medium shadow">
              ✂️ ตัด (-1)
            </button>
            <button onclick="openEditModal(${item.rowIndex})" class="text-blue-600 hover:text-blue-800 text-xs font-medium pt-1">
              ✏️ แก้ไข Lot
            </button>
          </div>
        `;
        container.appendChild(lotCard);
      });

      toggleLotsModal(true);
    }

    function toggleLotsModal(show) {
      document.getElementById('lotsModal').classList.toggle('hidden', !show);
    }

    function startDeductScanner() {
      targetInputIdForScan = null;
      document.getElementById('scannerTitle').innerText = "📷 ส่องบาร์โค้ดเพื่อตัดสต็อก";
      openScannerModal();
    }

    function startFormScanner(inputId) {
      targetInputIdForScan = inputId;
      document.getElementById('scannerTitle').innerText = "📷 ส่องบาร์โค้ดเพื่อใส่ข้อมูล";
      openScannerModal();
    }

    function openScannerModal() {
      document.getElementById('scannerModal').classList.remove('hidden');
      html5QrcodeScanner = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 150 } };
      
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).catch(err => {
        alert("ไม่สามารถเปิดกล้องได้ โปรดอนุญาตสิทธิ์การใช้กล้องในเบราว์เซอร์");
        stopScanner();
      });
    }

    async function onScanSuccess(decodedText) {
      if ('vibrate' in navigator) navigator.vibrate(200);
      stopScanner();

      if (targetInputIdForScan) {
        document.getElementById(targetInputIdForScan).value = decodedText;
        targetInputIdForScan = null;
        return;
      }

      const item = products.find(p => p.barcode && p.barcode.trim() === decodedText.trim());
      if (item) {
        if (confirm(`พบสินค้า: ${item.brand} (${item.lotNo || 'ไม่ระบุ Lot'})\nยืนยันตัดสต็อก 1 ชิ้น?`)) {
          await handleDeduct(item.rowIndex);
        }
      } else {
        alert(`ไม่พบสินค้าที่มีรหัสบาร์โค้ด: ${decodedText}`);
      }
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          document.getElementById('scannerModal').classList.add('hidden');
        }).catch(() => {
          document.getElementById('scannerModal').classList.add('hidden');
        });
      } else {
        document.getElementById('scannerModal').classList.add('hidden');
      }
    }

    function openEditModal(rowIndex) {
      const item = products.find(p => p.rowIndex === rowIndex);
      if (!item) return;

      document.getElementById('editRowIndex').value = item.rowIndex;
      document.getElementById('editLotNo').value = item.lotNo || '';
      document.getElementById('editBarcode').value = item.barcode || '';
      document.getElementById('editImageUrl').value = item.imageUrl || '';
      document.getElementById('editBrand').value = item.brand || '';
      document.getElementById('editVolume').value = item.volume || '';
      document.getElementById('editTotalQty').value = item.totalQty || 0;
      document.getElementById('editUnit').value = item.unit || 'ถุง';
      document.getElementById('editRemainingQty').value = item.remainingQty || 0;
      document.getElementById('editImportDate').value = item.importDate || '';
      document.getElementById('editExpDate').value = item.expDate || '';
      document.getElementById('editCostPrice').value = item.costPrice || 0;
      document.getElementById('editSuggestedPrice').value = item.suggestedPrice || 0;
      document.getElementById('editNote').value = item.note || '';

      const previewContainer = document.getElementById('editPreview');
      const previewImg = document.getElementById('editPreviewImg');
      if (item.imageUrl) {
        previewImg.src = item.imageUrl;
        previewContainer.classList.remove('hidden');
      } else {
        previewContainer.classList.add('hidden');
      }

      toggleEditModal(true);
    }

    async function handleEditSubmit(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      data.action = 'edit';

      toggleEditModal(false);
      await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });
      fetchData();
    }

    async function handleDeleteFromModal() {
      const rowIndex = document.getElementById('editRowIndex').value;
      if (!confirm('คุณแน่ใจหรือไม่ว่าต้องการลบ Lot นี้นะ?')) return;
      toggleEditModal(false);
      await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', rowIndex })
      });
      toggleLotsModal(false);
      fetchData();
    }

    function calcSuggestedPrice(costId, targetId) {
      const cost = parseFloat(document.getElementById(costId).value) || 0;
      document.getElementById(targetId).value = (cost * 1.5).toFixed(2);
    }

    async function handleDeduct(rowIndex) {
      await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'deduct', rowIndex, deductQty: 1 })
      });
      fetchData();
      toggleLotsModal(false);
    }

    async function handleAddSubmit(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      data.action = 'add';

      toggleAddModal(false);
      await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });
      e.target.reset();
      document.getElementById('addPreview').classList.add('hidden');
      fetchData();
    }

    function toggleAddModal(show) {
      document.getElementById('addModal').classList.toggle('hidden', !show);
    }

    function toggleEditModal(show) {
      document.getElementById('editModal').classList.toggle('hidden', !show);
    }

    fetchData();
  </script>
</body>
</html>
