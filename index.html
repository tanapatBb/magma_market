<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Magma Market - Portal Management</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div class="container main-ui">
  <h1>🐾 Magma Market Portal</h1>

  <div class="tab-menu">
    <button class="tab-btn active" onclick="switchTab('stock-tab')">📦 คลังสินค้า</button>
    <button class="tab-btn" onclick="switchTab('database-tab')">⚙️ Database</button>
  </div>

  <div id="stock-tab" class="tab-content active">
    
    <div class="card-box scanner-card">
      <button class="btn btn-secondary btn-block" onclick="toggleScanner()">
        📷 สแกนบาร์โค้ดตัดสต็อก (-1)
      </button>
      <div id="reader-container" style="display: none; margin-top: 15px;">
        <div id="reader"></div>
        <button class="btn btn-delete btn-block" onclick="stopScanner()" style="margin-top: 10px;">❌ ปิดกล้อง</button>
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <button class="btn btn-primary btn-block" onclick="toggleAddForm()">
        ➕ เพิ่มรายการสินค้าใหม่
      </button>
    </div>

    <div class="card-box" id="addProductFormCard" style="display: none;">
      <h2>➕ เพิ่มสินค้าเข้าสต็อก</h2>
      <form id="productForm" onsubmit="handleAddProduct(event)">
        <div class="form-row">
          <div class="form-group">
            <label>ยี่ห้อ (Brand)</label>
            <input type="text" id="brand" placeholder="เช่น SmartHeart" required>
          </div>
          <div class="form-group">
            <label>ชื่อสูตร/สินค้า</label>
            <input type="text" id="name" placeholder="เช่น อาหารสุนัข" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>เลขล็อตนำเข้า (Lot No.)</label>
            <input type="text" id="lotNo" placeholder="เช่น LOT-20260801" required>
          </div>
          <div class="form-group">
            <label>จำนวนสต็อก (ถุง)</label>
            <input type="number" id="stock" placeholder="0" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>📅 วันที่รับเข้า</label>
            <input type="date" id="importDate" required onchange="autoCalcExpiry()">
          </div>
          <div class="form-group">
            <label>⚠️ วันที่หมดอายุ (EXP)</label>
            <input type="date" id="expiryDate" required>
            <!-- ปุ่มทางลัดเลือกวันหมดอายุ -->
            <div class="quick-exp-btns">
              <button type="button" class="btn-quick" onclick="addMonthsToExpiry(3)">+3 เดือน</button>
              <button type="button" class="btn-quick" onclick="addMonthsToExpiry(6)">+6 เดือน</button>
              <button type="button" class="btn-quick" onclick="addMonthsToExpiry(12)">+1 ปี</button>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>ขนาด/ปริมาตร</label>
            <input type="number" step="any" id="volumeValue" placeholder="เช่น 1.2">
          </div>
          <div class="form-group">
            <label>หน่วย</label>
            <select id="volumeUnit">
              <option value="kg">kg</option>
              <option value="g">g</option>
              <option value="ถุง">ถุง/ชิ้น</option>
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
          <label>📸 รูปสินค้า</label>
          <input type="file" id="productImage" accept="image/*" capture="environment" onchange="previewImage(event)">
          <div id="imagePreviewContainer" style="margin-top: 10px; display: none;">
            <img id="imagePreview" src="" alt="Preview" style="max-width: 100px; border-radius: 8px;">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">💾 บันทึกลง Database</button>
      </form>
    </div>

    <div class="card-box">
      <h2>📦 รายการสินค้าคงเหลือ</h2>
      <div id="productList" class="product-grid">
        <div class="empty-state">กำลังโหลดข้อมูล...</div>
      </div>
    </div>
  </div>

  <div id="database-tab" class="tab-content">
    <div class="card-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
        <h2>📊 ตาราง Database</h2>
        <button class="btn btn-secondary" onclick="fetchDatabaseTable()">🔄 รีเฟรช</button>
      </div>

      <div class="table-responsive">
        <table class="db-table" id="dbMainTable">
          <thead id="dbTableHeader"></thead>
          <tbody id="dbTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal แก้ไขสินค้า -->
<div id="editModal" class="modal-overlay main-ui">
  <div class="modal-content">
    <h3>✏️ แก้ไขรายละเอียดสินค้า</h3>
    <form id="editForm" onsubmit="handleUpdateProduct(event)" style="margin-top: 15px;">
      <input type="hidden" id="editId">
      
      <div class="form-row">
        <div class="form-group">
          <label>ยี่ห้อ (Brand)</label>
          <input type="text" id="editBrand" required>
        </div>
        <div class="form-group">
          <label>ชื่อสูตร/สินค้า</label>
          <input type="text" id="editName" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>เลขล็อต (Lot No.)</label>
          <input type="text" id="editLotNo" required>
        </div>
        <div class="form-group">
          <label>จำนวนสต็อก (ถุง)</label>
          <input type="number" id="editStock" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>📅 วันที่รับเข้า</label>
          <input type="date" id="editImportDate" required>
        </div>
        <div class="form-group">
          <label>⚠️ วันที่หมดอายุ (EXP)</label>
          <input type="date" id="editExpiryDate" required>
          <div class="quick-exp-btns">
            <button type="button" class="btn-quick" onclick="addMonthsToExpiry(3, true)">+3M</button>
            <button type="button" class="btn-quick" onclick="addMonthsToExpiry(6, true)">+6M</button>
            <button type="button" class="btn-quick" onclick="addMonthsToExpiry(12, true)">+1Y</button>
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 15px;">
        <label>ขนาด/ปริมาตร</label>
        <input type="text" id="editSize" placeholder="เช่น 1.2 kg">
      </div>

      <div class="modal-actions">
        <button type="submit" class="btn btn-primary" style="flex:1;">💾 บันทึก</button>
        <button type="button" class="btn btn-secondary" onclick="closeEditModal()" style="flex:1;">ยกเลิก</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal บาร์โค้ด -->
<div id="barcodeModal" class="modal-overlay main-ui">
  <div class="modal-content">
    <h3>✅ บันทึกสินค้าสำเร็จ!</h3>
    <p>รหัสบาร์โค้ด: <b id="modalBarcodeText" style="font-size: 1.2rem; color: #27ae60;">-</b></p>
    <p style="margin-top: -5px; font-size: 0.9rem; color: #666;">ล็อต: <span id="modalLotText">-</span></p>
    <div style="margin: 15px 0;">
      <svg id="modalBarcodeCanvas"></svg>
    </div>
    <div class="modal-actions">
      <button class="btn btn-warning" onclick="triggerPrintFromModal()" style="flex:1;">🖨️ พิมพ์</button>
      <button class="btn btn-secondary" onclick="closeModal()" style="flex:1;">ปิด</button>
    </div>
  </div>
</div>

<div id="printArea">
  <div class="label-box">
    <div class="label-title" id="printBrand">BRAND</div>
    <div class="label-name" id="printName">PRODUCT NAME</div>
    <div class="label-lot" id="printLot">LOT: -</div>
    <svg id="barcodeCanvas"></svg>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
